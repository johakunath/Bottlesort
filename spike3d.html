<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vessel — 3D spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120b; font: 13px/1.35 system-ui, sans-serif; color: #fff; }
  #bg { position: fixed; inset: 0; background-size: cover; background-position: center; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
  #bar { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; color: #fff; background: rgba(12, 14, 28, 0.72); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px; padding: 9px 14px; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; margin: 0; padding: 7px 9px; border-radius: 10px; background: rgba(8, 12, 20, 0.78); font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre; pointer-events: none; }
  #note { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; max-width: 46vw; padding: 7px 9px; border-radius: 10px; background: rgba(8, 12, 20, 0.6); font-size: 11px; text-align: right; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<pre id="hud"></pre>
<div id="note">3D spike · tap a bottle, then a target</div>
<div id="bar">
  <button id="b-theme">Theme</button>
  <button id="b-res">Resolution</button>
  <button id="b-auto">Auto-play</button>
  <button id="b-count">Bottles</button>
  <button id="b-reset">Reset</button>
</div>
<script type="module" src="/src/spike3d/main.js"></script>
</body>
</html>
