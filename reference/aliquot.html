<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#c5d4d6">
<meta name="color-scheme" content="light">
<title>Aliquot</title>
<style>
:root{
  --tile:#c5d4d6;
  --ink:#1f2e35;
  --ink-2:#4e6067;
  --label:#f8faf9;
  --label-edge:#9db0b5;
  --focus:#2a5bd0;
  --cond:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  background:var(--tile);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden;overscroll-behavior:none}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background-color:var(--tile);color:var(--ink);
  font-family:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
#cv,#shelf{position:fixed;left:0;top:0;width:100vw;height:100%;display:block;touch-action:none;z-index:0}
#shelf{pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;pointer-events:none}
#app button{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* header */
#top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 0 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:21px;letter-spacing:.01em;color:var(--ink)}
.brand svg{width:13px;height:24px;flex:none}
.face{background:var(--label);border:1px solid var(--label-edge);
  box-shadow:0 1.5px 0 rgba(31,46,53,.28),inset 0 0 0 3px var(--label),inset 0 0 0 4px rgba(31,46,53,.14)}
#levelBtn{display:flex;align-items:baseline;gap:6px;padding:7px 12px 7px 15px;border-radius:7px;font-family:var(--cond);font-stretch:condensed;line-height:1;min-height:44px;align-items:center}
#levelBtn .w{font-weight:500;font-size:18px;color:var(--ink-2)}
#levelBtn .n{font-weight:800;font-size:25px;min-width:1ch;font-variant-numeric:tabular-nums}
#levelBtn svg{width:12px;height:12px;margin-left:2px;opacity:.7}
#levelBtn:active{transform:translateY(1px);box-shadow:0 .5px 0 rgba(31,46,53,.28),inset 0 0 0 3px var(--label),inset 0 0 0 4px rgba(31,46,53,.14)}
#muteBtn{justify-self:end;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0}
#muteBtn svg{width:22px;height:22px}
#caption{margin:10px auto 0;padding:0 28px;max-width:30em;text-align:center;font-size:14.5px;line-height:1.45;color:var(--ink-2);min-height:0;transition:opacity .3s}
#caption:empty{display:none}

#stage{flex:1}

/* footer tools */
#bar{display:flex;justify-content:center;gap:clamp(18px,7vw,40px);padding:6px 16px 14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font-family:var(--cond);font-stretch:condensed;font-weight:600;font-size:14px;color:var(--ink);min-width:64px}
.tool .knob{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:transform .08s}
.tool .knob svg{width:26px;height:26px}
.tool:active .knob{transform:translateY(2px);box-shadow:0 0 0 rgba(31,46,53,.28),inset 0 0 0 3px var(--label),inset 0 0 0 4px rgba(31,46,53,.14)}
.tool:disabled{opacity:.38;cursor:default}
.tool:disabled .knob{transform:none}
.tool.busy .knob svg{animation:blink .6s ease-in-out infinite alternate}
.tool.nudge .knob{animation:nudge .5s ease-in-out 3}
@keyframes blink{to{opacity:.25}}
@keyframes nudge{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transform:translate(-50%,8px);
  max-width:min(86vw,360px);padding:10px 16px;border-radius:7px;font-size:14.5px;line-height:1.4;text-align:center;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* overlays */
.layer{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(31,46,53,.2);pointer-events:auto}
.layer[hidden]{display:none}
.slip{width:min(84vw,330px);padding:24px 24px 20px;border-radius:9px;text-align:left}
#winLayer .slip{transform:rotate(-1.5deg);animation:slap .34s cubic-bezier(.2,1.5,.45,1) both}
@keyframes slap{from{transform:scale(1.18) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-1.5deg);opacity:1}}
.slip h2{margin:0;font-family:var(--cond);font-stretch:condensed;font-weight:800;font-size:44px;line-height:.98;letter-spacing:-.005em}
.slip p{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.vials{display:flex;gap:5px;margin:16px 0 4px;flex-wrap:wrap}
.vials i{display:block;width:9px;height:24px;border:1.5px solid var(--ink);border-top-width:3px;border-radius:2px 2px 5px 5px}
.actions{display:flex;gap:12px;margin-top:20px;align-items:center}
.primary{flex:1;min-height:50px;border-radius:8px;border:0;background:var(--ink);color:var(--label);font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:20px;box-shadow:0 2px 0 #0e171b}
.primary:active{transform:translateY(2px);box-shadow:none}
.secondary{min-height:50px;padding:0 10px;border:0;background:none;font-family:var(--cond);font-stretch:condensed;font-weight:600;font-size:17px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
#levelsLayer .slip{max-height:min(78vh,560px);display:flex;flex-direction:column}
#levelsLayer h2{font-size:34px}
#levelsLayer p{margin-top:6px}
.grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;overflow-y:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.grid button{height:48px;border-radius:6px;border:1px solid var(--label-edge);background:#fff;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;position:relative}
.grid button.done::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#2d9a52}
.grid button.cur{border:2px solid var(--ink)}
#levelsLayer .actions{margin-top:14px}

@media (prefers-reduced-motion:reduce){
  #winLayer .slip{animation:none}
  .tool.nudge .knob,.tool.busy .knob svg{animation:none}
}
</style>
</head>
<body>
<canvas id="shelf" aria-hidden="true"></canvas>
<canvas id="cv" aria-label="Vials. Tap a vial, then tap another to pour into it."></canvas>
<div id="app">
  <header id="top">
    <div class="brand" aria-label="Aliquot">
      <svg viewBox="0 0 13 24" aria-hidden="true"><path d="M1.5 1.5h10" stroke="#1f2e35" stroke-width="2" stroke-linecap="round"/><path d="M2.6 2v17.2a3.9 3.9 0 0 0 7.8 0V2" fill="none" stroke="#1f2e35" stroke-width="1.6"/><path d="M3.4 11h6.2v8.2a3.1 3.1 0 0 1-6.2 0z" fill="#2a5bd0"/><path d="M3.4 15h6.2v4.2a3.1 3.1 0 0 1-6.2 0z" fill="#e0412f"/></svg>
      <span>Aliquot</span>
    </div>
    <button id="levelBtn" class="face" aria-label="Choose level" aria-haspopup="dialog"><span class="w">Level</span><span class="n" id="lvNum">1</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8l4-3.8" fill="none" stroke="#1f2e35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="muteBtn" class="face" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1f2e35" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="#1f2e35" fill-opacity=".08"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
    </button>
  </header>
  <p id="caption" aria-live="polite"></p>
  <div id="stage"></div>
  <footer id="bar">
    <button id="undoBtn" class="tool" aria-label="Undo last pour"><span class="knob face"><svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="#1f2e35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.5 4.5 12 9 16.5"/><path d="M5 12h10.5a5.5 5.5 0 0 1 0 11H12"/></svg></span>Undo</button>
    <button id="restartBtn" class="tool" aria-label="Restart level"><span class="knob face"><svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="#1f2e35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v5h-5"/></svg></span>Restart</button>
    <button id="hintBtn" class="tool" aria-label="Show a hint"><span class="knob face"><svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="#1f2e35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18c2-8 8-11 15-10"/><path d="M16 4.5 20.3 8 16.8 12.3"/><circle cx="5.5" cy="21" r="1.4" fill="#1f2e35" stroke="none"/></svg></span>Hint</button>
  </footer>
</div>
<div id="toast" class="face" role="status" aria-live="polite"></div>

<div id="winLayer" class="layer" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="slip face">
    <h2 id="winTitle">Level 1 sorted</h2>
    <div class="vials" id="winVials" aria-hidden="true"></div>
    <p id="winText">Finished in 3 pours.</p>
    <div class="actions">
      <button class="primary" id="nextBtn">Next level</button>
      <button class="secondary" id="replayBtn">Play again</button>
    </div>
  </div>
</div>

<div id="levelsLayer" class="layer" hidden role="dialog" aria-modal="true" aria-labelledby="lvTitle">
  <div class="slip face">
    <h2 id="lvTitle">Levels</h2>
    <p id="lvText">Replay any level you have reached.</p>
    <div class="grid" id="lvGrid"></div>
    <div class="actions"><button class="primary" id="lvClose">Close</button></div>
  </div>
</div>

<script>
(function () {
'use strict';
/*LOGIC-START*/
const CAP = 4;
const PALETTE_SIZE = 12;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32(x) {
  let h = (x ^ 0x9e3779b9) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}

function topRun(b) {
  const n = b.length; if (!n) return 0;
  const c = b[n - 1]; let k = 1;
  while (k < n && b[n - 1 - k] === c) k++;
  return k;
}
function isComplete(b) {
  if (b.length !== CAP) return false;
  for (let i = 1; i < CAP; i++) if (b[i] !== b[0]) return false;
  return true;
}
function canPour(s, a, b) {
  if (a === b) return false;
  const A = s[a], B = s[b];
  if (!A || !B || !A.length || B.length >= CAP) return false;
  if (B.length && B[B.length - 1] !== A[A.length - 1]) return false;
  return true;
}
function pourAmount(s, a, b) { return Math.min(topRun(s[a]), CAP - s[b].length); }
function applyMove(s, a, b) {
  const t = s.map(x => x.slice());
  const k = pourAmount(s, a, b);
  for (let i = 0; i < k; i++) t[b].push(t[a].pop());
  return t;
}
function isSolved(s) { return s.every(b => b.length === 0 || isComplete(b)); }
function stateKey(s) { return s.map(b => b.join('.')).join('|'); }

/* ---------- Solver: weighted best-first search over canonical states ---------- */
const HCNT = new Int32Array(32);
function heurStr(arr) {
  let h = 0; HCNT.fill(0);
  for (let j = 0; j < arr.length; j++) {
    const b = arr[j], L = b.length; if (!L) continue;
    let seen = 0, prev = -1;
    for (let i = 0; i < L; i++) {
      const c = b.charCodeAt(i) - 65;
      if (c !== prev) { if (prev !== -1) h++; prev = c; }
      if (!(seen & (1 << c))) { seen |= 1 << c; HCNT[c]++; }
    }
  }
  for (let c = 0; c < 32; c++) if (HCNT[c] > 1) h += HCNT[c] - 1;
  return h;
}
function solvedStr(arr) {
  for (const b of arr) {
    if (!b) continue;
    if (b.length !== CAP) return false;
    for (let i = 1; i < CAP; i++) if (b.charCodeAt(i) !== b.charCodeAt(0)) return false;
  }
  return true;
}
function solve(state, maxExpand, maxNodes, weight) {
  maxExpand = maxExpand || 30000; maxNodes = maxNodes || 250000; const W = weight || 3;
  const s0 = state.map(b => b.map(c => String.fromCharCode(65 + c)).join(''));
  if (solvedStr(s0)) return [];
  const n = s0.length, M = 4194304;
  const S = [s0], G = [0], P = [-1], MA = [-1], MB = [-1], K = [s0.slice().sort().join('|')];
  const best = new Map(); best.set(K[0], 0);
  const heap = [W * heurStr(s0) * M];
  const push = v => { let i = heap.length; heap.push(v); while (i > 0) { const p = (i - 1) >> 1; if (heap[p] <= v) break; heap[i] = heap[p]; i = p; } heap[i] = v; };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { let i = 0; const L = heap.length; for (;;) { let l = 2 * i + 1; if (l >= L) break; const r = l + 1; if (r < L && heap[r] < heap[l]) l = r; if (heap[l] >= last) break; heap[i] = heap[l]; i = l; } heap[i] = last; } return top; };
  let expanded = 0;
  while (heap.length) {
    const id = pop() % M;
    const s = S[id], g = G[id];
    if (best.get(K[id]) < g) continue;
    if (solvedStr(s)) {
      const out = []; let q = id;
      while (P[q] >= 0) { out.push([MA[q], MB[q]]); q = P[q]; }
      return out.reverse();
    }
    if (++expanded > maxExpand) return null;
    for (let a = 0; a < n; a++) {
      const A = s[a], la = A.length; if (!la) continue;
      const top = A.charCodeAt(la - 1); let run = 1;
      while (run < la && A.charCodeAt(la - 1 - run) === top) run++;
      if (run === CAP) continue;
      const pure = run === la;
      let triedEmpty = false;
      for (let b = 0; b < n; b++) {
        if (b === a) continue;
        const B = s[b], lb = B.length; if (lb === CAP) continue;
        if (lb === 0) { if (pure || triedEmpty) continue; triedEmpty = true; }
        else if (B.charCodeAt(lb - 1) !== top) continue;
        const k = run < CAP - lb ? run : CAP - lb;
        const ns = s.slice(); ns[a] = A.slice(0, la - k); ns[b] = B + A.slice(la - k);
        const key = ns.slice().sort().join('|');
        const ng = g + 1, pg = best.get(key);
        if (pg !== undefined && pg <= ng) continue;
        if (S.length >= maxNodes) return null;
        best.set(key, ng);
        const nid = S.length;
        S.push(ns); G.push(ng); P.push(id); MA.push(a); MB.push(b); K.push(key);
        push((ng + W * heurStr(ns)) * M + nid);
      }
    }
  }
  return null;
}

/* ---------- Level generation ---------- */
function levelParams(N) {
  const steps = [[1, 2], [2, 3], [3, 4], [5, 5], [8, 6], [12, 7], [17, 8], [23, 9], [30, 10], [38, 11], [48, 12]];
  let c = 2; for (const [lv, cc] of steps) if (N >= lv) c = cc;
  let spares = N === 1 ? 1 : 2;
  const glue = N <= 2 ? 0.8 : N <= 4 ? 0.55 : N <= 8 ? 0.35 : N <= 14 ? 0.2 : N <= 22 ? 0.1 : 0;
  const maxAdj = N <= 14 ? 99 : N <= 30 ? Math.ceil(c * 0.5) : N <= 50 ? Math.ceil(c * 0.25) : 1;
  let layout = 'empty';
  if (N >= 20 && N % 4 === 1) layout = 'scatter';
  let tight = false;
  if (N >= 10 && N % 5 === 0) { tight = true; spares = 1; c = Math.max(5, Math.min(9, c - 1)); layout = 'empty'; }
  return { c, spares, glue, maxAdj, layout, tight };
}
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function makeCandidate(p, rng) {
  const c = p.c, nb = c + p.spares;
  const chunks = [];
  for (let col = 0; col < c; col++) {
    let sizes = [1];
    for (let j = 1; j < CAP; j++) { if (rng() < p.glue) sizes[sizes.length - 1]++; else sizes.push(1); }
    if (sizes.length === 1) sizes = [2, 2];
    for (const s of sizes) chunks.push([col, s]);
  }
  shuffle(chunks, rng);
  const seq = [];
  for (const [col, s] of chunks) for (let i = 0; i < s; i++) seq.push(col);
  const caps = new Array(nb).fill(0);
  if (p.layout === 'scatter' && p.spares >= 2) {
    for (let i = 0; i < nb - 1; i++) caps[i] = CAP;
    let remove = CAP * (p.spares - 1), guard = 0;
    while (remove > 0 && guard++ < 1000) { const i = Math.floor(rng() * (nb - 1)); if (caps[i] > 2) { caps[i]--; remove--; } }
  } else {
    for (let i = 0; i < c; i++) caps[i] = CAP;
  }
  const bottles = caps.map(() => []);
  let k = 0;
  for (let i = 0; i < nb; i++) for (let j = 0; j < caps[i]; j++) bottles[i].push(seq[k++]);
  let adj = 0;
  for (const b of bottles) {
    if (isComplete(b)) return null;
    for (let j = 1; j < b.length; j++) if (b[j] === b[j - 1]) adj++;
  }
  if (adj > p.maxAdj) return null;
  return bottles;
}
function generateLevel(N) {
  const base = levelParams(N);
  const rng = mulberry32(hash32(N * 7919 + 17));
  for (let relax = 0; relax < 4; relax++) {
    const p = Object.assign({}, base);
    if (relax >= 1) p.maxAdj += 2 * relax;
    if (relax >= 2) p.spares = Math.max(p.spares, 2);
    if (relax >= 3) p.spares = 3;
    let solverRuns = 0;
    const runBudget = p.spares === 1 ? 600 : 40;
    for (let attempt = 0; attempt < 20000 && solverRuns < runBudget; attempt++) {
      const b = makeCandidate(p, rng);
      if (!b) continue;
      solverRuns++;
      const sol = solve(b, 30000, 250000);
      if (sol && sol.length >= Math.min(p.c + 1, 6)) return { n: N, bottles: b, solution: sol, params: p };
    }
  }
  return null;
}

/* ---------- Vial geometry and liquid-volume math (normalized: interior width 1) ---------- */
const GEO = { hs: 0.5, lh: 0.56, r: 0.2, t: 0.08, rimH: 0.17, flare: 0.08 };
const IH = GEO.hs + 4 * GEO.lh;
function buildInterior() {
  const H = IH, r = GEO.r, pts = [[-0.5, 0], [0.5, 0], [0.5, H - r]];
  const seg = 8;
  for (let i = 1; i <= seg; i++) { const a = (i / seg) * Math.PI / 2; pts.push([0.5 - r + r * Math.cos(a), H - r + r * Math.sin(a)]); }
  pts.push([-0.5 + r, H]);
  for (let i = 1; i <= seg; i++) { const a = Math.PI / 2 + (i / seg) * Math.PI / 2; pts.push([-0.5 + r + r * Math.cos(a), H - r + r * Math.sin(a)]); }
  return pts;
}
const INTERIOR = buildInterior();
function areaBelow(xs, ys, n, L) {
  let area = 0, first = true, fx = 0, fy = 0, px = 0, py = 0;
  let sx = xs[n - 1], sy = ys[n - 1], sin = sy >= L;
  for (let i = 0; i < n; i++) {
    const ex = xs[i], ey = ys[i], ein = ey >= L;
    if (ein !== sin) {
      const t = (L - sy) / (ey - sy), ix = sx + (ex - sx) * t;
      if (first) { fx = ix; fy = L; first = false; } else area += px * L - ix * py;
      px = ix; py = L;
    }
    if (ein) {
      if (first) { fx = ex; fy = ey; first = false; } else area += px * ey - ex * py;
      px = ex; py = ey;
    }
    sx = ex; sy = ey; sin = ein;
  }
  if (first) return 0;
  area += px * fy - fx * py;
  return Math.abs(area) * 0.5;
}

(function makeWall() {

    const g = c.getContext('2d'); g.scale(s, s);

      const x = q * T + 1.5, y = r * T + 1.5, w = T - 3, h = T - 3;
      const j = (rng() - .5) * 0.05;

      const gr = g.createLinearGradient(x, y, x + w, y + h);
      gr.addColorStop(0, 'rgb(' + base.map(v => Math.min(255, v + 9)).join(',') + ')');
      gr.addColorStop(.55, 'rgb(' + base.join(',') + ')');
